; Программатор-тестер карт Flash и чипов Zoom (ATtiny816 / ATtiny1616)
; При включении — автономный тест (OLED + кнопка), при подключении
; программы ПК (pc/gui.py) — управление с ПК, обмен 250000 бод.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 250000
build_flags = -Wall
